<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3D2008">
  <title>À cuire — Au Comptoir des Lilas</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layouts.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    .pac-bandeau {
      background: rgba(232,145,58,.10);
      border-bottom: 1px solid rgba(232,145,58,.25);
      color: var(--color-warning);
      font-size: var(--text-sm);
      font-weight: 600;
      padding: 0.75rem 1rem;
      line-height: 1.4;
    }
    .pac-liste {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 1rem;
    }
    .pac-carte { border-left: 4px solid var(--color-warning); }
    .pac-carte-titre { font-size: var(--text-lg); font-weight: 800; }
    .pac-carte-sous { font-size: var(--text-sm); color: var(--color-accent); margin: 0.2rem 0 0.75rem; }
    .pac-carte-sous b { color: var(--color-text); }
    .pac-message { text-align: center; padding: 3rem 1rem; color: var(--color-accent); }
    .pac-message-icone { font-size: 42px; margin-bottom: 0.6rem; }
  </style>
</head>
<body>
  <script src="/static/js/core/guard.js"></script>

  <header class="page-header page-header--tall">
    <a href="/hub.html" class="page-header-back" title="Retour au hub">← Hub</a>
    <h1 class="page-header-title">🍽 À CUIRE</h1>
    <span class="page-header-clock" id="pac-horloge" aria-live="polite"></span>
  </header>

  <div class="pac-bandeau">
    Lots reçus déjà préparés (plats traiteur) en attente de remise en température
    (cuisson ≥ 75 °C puis refroidissement ≤ 10 °C en ≤ 2 h).
  </div>

  <div class="pac-liste" id="pac-liste" role="list" aria-label="Lots à cuire"></div>

  <div class="pac-message" id="pac-message" hidden>
    <div class="pac-message-icone" id="pac-message-icone">⏳</div>
    <div id="pac-message-texte">Chargement…</div>
  </div>

  <script src="/static/js/production-a-cuire.js"></script>
</body>
</html>
