<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#3D2008">
  <title>HACCP — Au Comptoir des Lilas</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/css/reset.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/layouts.css">
  <link rel="stylesheet" href="/static/css/pages/hub.css">
</head>
<body class="hub-body">
<script src="/static/js/core/guard.js"></script>

  <!-- ========================================================
       EN-TÊTE
  ========================================================= -->
  <header class="hub-header">
    <span class="hub-nav">
      <a href="#" id="hub-retour" class="hub-btn-admin" hidden>← Accueil</a>
      <a href="#" id="hub-accueil" class="hub-btn-admin" aria-label="Accueil du Hub" title="Accueil du Hub" hidden>🏠</a>
    </span>
    <div class="hub-titre" id="hub-titre">Au Comptoir des Lilas</div>
    <div id="hub-horloge" class="hub-horloge" aria-live="polite"></div>
    <button type="button" id="hub-cloche" class="hub-btn-cloche"
            aria-label="Voir les tâches du jour" hidden>
      <span aria-hidden="true">🔔</span>
      <span id="hub-cloche-badge" class="hub-cloche-badge" hidden>0</span>
    </button>
    <button type="button" id="hub-btn-perso" class="hub-btn-admin hub-btn-perso"
            aria-label="Personnaliser l'accueil" title="Ranger, retirer ou ajouter des tuiles">✏️</button>
    <a href="/admin.html" class="hub-btn-admin" aria-label="Configuration">⚙ Admin</a>
  </header>

  <!-- ========================================================
       BARRE — Mode « Personnaliser l'accueil » (administrateur)
  ========================================================= -->
  <div id="hub-edition-barre" class="hub-edition-barre" hidden>
    <span class="hub-edition-aide">Glissez pour déplacer · 📁 ranger dans un dossier · ✕ retirer</span>
    <div class="hub-edition-actions">
      <button type="button" id="hub-edition-ajouter" class="hub-edition-btn">＋ Ajouter une tuile</button>
      <button type="button" id="hub-edition-dossier" class="hub-edition-btn">＋ Nouveau dossier</button>
      <button type="button" id="hub-edition-origine" class="hub-edition-btn">↺ Revenir à l'origine</button>
      <button type="button" id="hub-edition-annuler" class="hub-edition-btn">Annuler</button>
      <button type="button" id="hub-edition-terminer" class="hub-edition-btn hub-edition-btn--ok">✓ Terminer</button>
    </div>
    <span id="hub-edition-statut" class="hub-edition-statut" hidden></span>
  </div>

  <!-- ========================================================
       BANDEAU — Connexion perdue (orange, discret)
  ========================================================= -->
  <div id="hub-bandeau-connexion" class="hub-bandeau-connexion" hidden>
    ⚠ Connexion au serveur perdue — vérifiez le Raspberry Pi
  </div>

  <!-- ========================================================
       GRILLE — tuiles et dossiers, construits par hub.js à partir de la
       disposition enregistrée (ou de la disposition d'origine).
       Cachée le temps de lire la disposition (évite un saut visuel).
  ========================================================= -->
  <main class="hub-grille hub-grille--attente" id="hub-grille" role="main"></main>

  <!-- ========================================================
       POPUP — Tâches du jour & à venir
  ========================================================= -->
  <div id="hub-popup-overlay" class="hub-popup-overlay" hidden role="dialog"
       aria-modal="true" aria-labelledby="hub-popup-titre">
    <div class="hub-popup">
      <header class="hub-popup-header">
        <h2 id="hub-popup-titre" class="hub-popup-titre">📋 Tâches HACCP</h2>
        <button type="button" id="hub-popup-fermer" class="hub-popup-fermer"
                aria-label="Fermer">✕</button>
      </header>

      <section class="hub-popup-section">
        <h3 class="hub-popup-section-titre">
          <span class="hub-popup-pastille hub-popup-pastille--rouge"></span>
          À faire aujourd'hui
        </h3>
        <ul id="hub-popup-aujourdhui" class="hub-popup-liste"></ul>
      </section>

      <section class="hub-popup-section">
        <h3 class="hub-popup-section-titre">
          <span class="hub-popup-pastille hub-popup-pastille--orange"></span>
          À venir (≤ 14 jours)
        </h3>
        <ul id="hub-popup-avenir" class="hub-popup-liste"></ul>
      </section>

      <footer class="hub-popup-footer">
        <button type="button" id="hub-popup-snooze" class="hub-popup-snooze">
          🔕 Ne plus afficher pendant 2h
        </button>
      </footer>
    </div>
  </div>

  <!-- ========================================================
       POPUP — Mot de passe administrateur (personnaliser l'accueil)
  ========================================================= -->
  <div id="hub-mdp-overlay" class="hub-popup-overlay" hidden role="dialog"
       aria-modal="true" aria-labelledby="hub-mdp-titre">
    <form class="hub-popup hub-popup--petit" id="hub-mdp-form">
      <header class="hub-popup-header">
        <h2 id="hub-mdp-titre" class="hub-popup-titre">🔒 Personnaliser l'accueil</h2>
        <button type="button" class="hub-popup-fermer" data-fermer aria-label="Fermer">✕</button>
      </header>
      <section class="hub-popup-section">
        <label for="hub-mdp" class="hub-mdp-label">Mot de passe administrateur</label>
        <input type="password" id="hub-mdp" class="hub-mdp-champ" autocomplete="current-password">
        <p id="hub-mdp-erreur" class="hub-mdp-erreur" hidden></p>
      </section>
      <footer class="hub-popup-footer">
        <button type="submit" class="hub-edition-btn hub-edition-btn--ok">Déverrouiller</button>
      </footer>
    </form>
  </div>

  <!-- ========================================================
       POPUP — Ajouter une tuile
  ========================================================= -->
  <div id="hub-choix-overlay" class="hub-popup-overlay" hidden role="dialog"
       aria-modal="true" aria-labelledby="hub-choix-titre">
    <div class="hub-popup">
      <header class="hub-popup-header">
        <h2 id="hub-choix-titre" class="hub-popup-titre"></h2>
        <button type="button" class="hub-popup-fermer" data-fermer aria-label="Fermer">✕</button>
      </header>
      <section class="hub-popup-section">
        <ul id="hub-choix-liste" class="hub-popup-liste"></ul>
      </section>
    </div>
  </div>

  <!-- ========================================================
       POPUP — Nouveau dossier / renommer un dossier
  ========================================================= -->
  <div id="hub-dossier-overlay" class="hub-popup-overlay" hidden role="dialog"
       aria-modal="true" aria-labelledby="hub-dossier-titre">
    <form class="hub-popup hub-popup--petit" id="hub-dossier-form">
      <header class="hub-popup-header">
        <h2 id="hub-dossier-titre" class="hub-popup-titre">📁 Nouveau dossier</h2>
        <button type="button" class="hub-popup-fermer" data-fermer aria-label="Fermer">✕</button>
      </header>
      <section class="hub-popup-section">
        <label for="hub-dossier-nom" class="hub-mdp-label">Nom du dossier</label>
        <input type="text" id="hub-dossier-nom" class="hub-mdp-champ" maxlength="40" required>
        <span class="hub-mdp-label hub-dossier-label-icone">Icône</span>
        <div id="hub-dossier-icones" class="hub-dossier-icones"></div>
      </section>
      <footer class="hub-popup-footer">
        <button type="submit" class="hub-edition-btn hub-edition-btn--ok">Valider</button>
      </footer>
    </form>
  </div>

  <script src="/static/js/hub.js"></script>
</body>
</html>
